name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_as:
        description: Optional one-time semantic version override, for example 0.1.0.
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-release.yml@0523510a8e42290df3bae5749d034b1637569af5
    with:
      target-branch: main
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      release-as: ${{ inputs.release_as }}
    secrets:
      release_token: ${{ secrets.APPFACTORY_RELEASE_TOKEN }}
