name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@0523510a8e42290df3bae5749d034b1637569af5
    with:
      appfactory_ref: 0523510a8e42290df3bae5749d034b1637569af5
      config_path: .github/appfactory-impact.json
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  web:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'web') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck --workspace apps/web
      - run: npm run build --workspace apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm test --workspace apps/web

  # Public pages (served by the built preview, no API): screenshots, keyboard and
  # axe checks, reduced motion, Lighthouse budgets. Authenticated screens are
  # covered by the Playwright suite of the web job (accessibility.spec.ts).
  visual-qa:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'visual-qa') }}
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-visual-qa.yml@8847e4888fc4021060f06ba29f0cf94677ed2d7d
    with:
      appfactory_ref: 8847e4888fc4021060f06ba29f0cf94677ed2d7d
      config_path: .github/appfactory-visual-qa.json
      install_command: npm install --ignore-scripts --no-audit --no-fund
      build_command: npm run build --workspace apps/web
      start_command: npm run preview --workspace apps/web -- --host 127.0.0.1 --port 4173 --strictPort
      server_url: http://127.0.0.1:4173/
      node_version: "24"

  contracts:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'contracts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck --workspace packages/contracts
      - name: Generated client matches openapi.json
        run: npm run check --workspace packages/contracts

  api:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'api') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck --workspace services/api
      - run: npm test --workspace services/api
      - name: openapi.json matches the routes
        run: npm run openapi:check --workspace services/api
      - name: Worker bundles (dry run, no deploy)
        run: npm run build --workspace services/api

  release-config:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'release-config') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate Release Please manifest and config
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("release-please-config.json", "utf8"));
            const manifest = JSON.parse(readFileSync(".release-please-manifest.json", "utf8"));
            const missing = Object.keys(config.packages).filter((p) => !(p in manifest));
            if (missing.length) { console.error("Packages missing from manifest:", missing); process.exit(1); }
            console.log("Release Please manifest covers", Object.keys(config.packages).length, "package(s).");
          '

  # Always-green summary job so branch protection can require a single stable check
  # regardless of which surfaces the change impacted.
  mobile-android:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'mobile-android') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: gradle -p apps/mobile --no-daemon --console=plain -Proborazzi.test.record=true :shared:testAndroidHostTest :androidApp:testDebugUnitTest :androidApp:assembleDebug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-screenshots
          path: apps/mobile/androidApp/src/test/screenshots/
          if-no-files-found: ignore

  mobile-ios:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'mobile-ios') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: gradle -p apps/mobile --no-daemon --console=plain :shared:linkDebugFrameworkIosSimulatorArm64

  ci-summary:
    needs: [impact, web, visual-qa, contracts, api, release-config, mobile-android, mobile-ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any impacted gate failed
        run: |
          echo "Impacted surfaces: ${{ needs.impact.outputs.surfaces }}"
          echo "Required gates: ${{ needs.impact.outputs.gates }}"
          if [ "${{ needs.impact.result }}" != "success" ]; then exit 1; fi
          for r in "${{ needs.web.result }}" "${{ needs.visual-qa.result }}" "${{ needs.contracts.result }}" "${{ needs.api.result }}" "${{ needs.release-config.result }}" "${{ needs.mobile-android.result }}" "${{ needs.mobile-ios.result }}"; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
